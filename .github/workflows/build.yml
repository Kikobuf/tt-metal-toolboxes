name: Build and publish tt-metal toolboxes

on:
  schedule:
    # Check daily for new tt-metal releases
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tt_metal_ref:
        description: "tt-metal git ref / release tag to build (e.g. v0.67.4)"
        required: false
        default: "main"
  push:
    branches: [main]
    paths:
      - "toolboxes/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/kikobuf/tt-metal-toolboxes

jobs:
  check-latest-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
    steps:
      - name: Get latest tt-metal release tag
        id: latest
        run: |
          TAG=$(curl -s https://api.github.com/repos/tenstorrent/tt-metal/releases/latest | jq -r .tag_name)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-release:
    needs: check-latest-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tt-metal-release
        uses: docker/build-push-action@v6
        with:
          context: toolboxes/tt-metal-release
          push: true
          build-args: |
            TT_METAL_TAG=latest-rc
          tags: |
            ${{ env.IMAGE_BASE }}:release
            ${{ env.IMAGE_BASE }}:release-${{ needs.check-latest-release.outputs.tag }}

  build-wheel:
    needs: check-latest-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tt-metal-wheel
        uses: docker/build-push-action@v6
        with:
          context: toolboxes/tt-metal-wheel
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:wheel

  build-source:
    # Source builds are heavier (30-60+ min) — only run on manual dispatch
    # or when explicitly requested, not on the daily schedule, to avoid
    # burning CI minutes rebuilding from source every day.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Real build time is 30-60+ min; cap well above that instead of relying
    # on GitHub's 360-minute default, so a hang (e.g. a stalled fetch) fails
    # fast rather than sitting "running" for up to 6 hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tt-metal-source
        uses: docker/build-push-action@v6
        with:
          context: toolboxes/tt-metal-source
          push: true
          build-args: |
            TT_METAL_REF=${{ github.event.inputs.tt_metal_ref || 'main' }}
          tags: |
            ${{ env.IMAGE_BASE }}:source-${{ github.event.inputs.tt_metal_ref || 'main' }}
